<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://world.openfoodfacts.org ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Wird von theme-init.js und farbschema.ts auf das geltende Schema gesetzt. -->
    <meta name="theme-color" content="#075F74" />
    <!--
      Läuft vor dem ersten Malen: sonst erschiene die App kurz hell, bevor
      React das dunkle Schema setzt. Als externe Datei bleibt script-src der
      Content Security Policy strikt auf 'self' begrenzt.
    -->
    <script src="%BASE_URL%theme-init.js"></script>
    <meta name="description" content="Nachschlagewerk für die Schwangerschaft: Lebensmittel und ausgewählte Medikamente sicher einordnen." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Nicht mehr «black-translucent»: dessen weisse Schrift lag auf der
      türkis-blauen Kopfleiste. Die ist weg, darunter steht jetzt der helle
      Grund — die Leiste folgt deshalb der theme-color oben.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Darf ich das?" />
    <title>Darf ich das? — Schwangerschafts-Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
