<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Wird vom Skript unten und von farbschema.ts auf das geltende Schema gesetzt. -->
    <meta name="theme-color" content="#14432F" />
    <!--
      Läuft vor dem ersten Malen: sonst erschiene die App kurz hell, bevor
      React das dunkle Schema setzt. Der Schlüssel steht in src/farbschema.ts.
    -->
    <script>
      (function () {
        var wunsch = null
        try {
          wunsch = localStorage.getItem('essens-check.farbschema')
        } catch (e) {
          /* gesperrter Speicher */
        }
        var dunkel =
          wunsch === 'dunkel' ||
          (wunsch !== 'hell' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.schema = dunkel ? 'dunkel' : 'hell'
        var leiste = document.querySelector('meta[name="theme-color"]')
        if (leiste) leiste.setAttribute('content', dunkel ? '#0F2E20' : '#14432F')
      })()
    </script>
    <meta name="description" content="Nachschlagewerk für die Schwangerschaft: Lebensmittel eingeben, eindeutige Antwort bekommen." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darf ich?" />
    <title>Darf ich das essen?</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
