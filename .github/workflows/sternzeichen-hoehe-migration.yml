name: Sternzeichen und Höhenwissen migrieren

on:
  push:
    branches: [ssw-sternzeichen-hoehe]
    paths:
      - .github/workflows/sternzeichen-hoehe-migration.yml

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssw-sternzeichen-hoehe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Migration anwenden
        run: node scripts/sternzeichen-hoehe-migration.mjs

      - name: Installieren und prüfen
        run: |
          npm ci
          npm run typecheck
          npm test -- --testTimeout=10000
          npm run build

      - name: Änderungen zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Sternzeichen im SSW-Block und Höhenhinweise ergänzen"
          git push origin HEAD:ssw-sternzeichen-hoehe
