name: Türkis-Marke und Reisewissen migrieren

on:
  push:
    branches: [tuerkis-reisen-wissen]
    paths:
      - .github/workflows/tuerkis-reisen-migration.yml

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tuerkis-reisen-wissen

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Design und Wissensbereich migrieren
        run: node scripts/tuerkis-reisen-migration.mjs

      - name: Änderungen zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src public vite.config.ts index.html SPEC.md DESIGN-REDESIGN.md
          git commit -m "Markenfarbe auf Türkis-Blau umstellen und Reisewissen ergänzen"
          git push origin HEAD:tuerkis-reisen-wissen
