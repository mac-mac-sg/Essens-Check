# Prüft jede Änderung und veröffentlicht nur, was auf main landet.
#
# Bei Pull Requests laufen Typprüfung, Unit-Tests und der Offline-Test gegen
# den echten Build — vor dem Merge, nicht erst währenddessen. Veröffentlicht
# wird ausschliesslich bei einem Push auf main.
#
# Voraussetzung, einmalig: Settings -> Pages -> Source auf "GitHub Actions".
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Läuft für einen Pull Request eine neuere Prüfung an, wird die alte abgebrochen.
# Ein laufendes Deployment auf main dagegen nie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VEROEFFENTLICHEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  pruefen:
    name: Prüfen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Abhängigkeiten auf hohe Risiken prüfen
        run: npm audit --audit-level=high

      - name: Typen und Unit-Tests
        run: |
          npm run typecheck
          npm test

      - name: Bauen
        run: npm run build

      # Der Offline-Test läuft gegen den echten Build. Trägt der Service Worker
      # nicht, wird weder gemergt noch veröffentlicht.
      - name: Offline-Test
        run: |
          npx playwright install --with-deps chromium
          npm run test:offline

      - name: Pages vorbereiten
        if: env.VEROEFFENTLICHEN == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Artefakt hochladen
        if: env.VEROEFFENTLICHEN == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    needs: pruefen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
