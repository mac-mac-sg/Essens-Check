name: Reise-Dokumentation abgleichen

on:
  push:
    branches: [tuerkis-reisen-wissen]
    paths:
      - .github/workflows/reise-doku-fix.yml

permissions:
  contents: write

jobs:
  doku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tuerkis-reisen-wissen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/reise-doku-fix.mjs
      - name: Änderungen zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPEC.md DESIGN-REDESIGN.md public/icon.svg public/favicon.svg
          git commit -m "Design- und Wissensdokumentation aktualisieren"
          git push origin HEAD:tuerkis-reisen-wissen
