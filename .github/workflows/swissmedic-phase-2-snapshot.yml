name: Swissmedic Phase-2-Snapshot erzeugen

on:
  push:
    branches: [medikamente-phase-2-swissmedic]
    paths:
      - .github/workflows/swissmedic-phase-2-snapshot.yml

permissions:
  contents: write

jobs:
  snapshot:
    name: Echten Swissmedic-Snapshot erzeugen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: medikamente-phase-2-swissmedic

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Swissmedic OGD laden und Snapshot erzeugen
        run: npm run medikamente:swissmedic

      - name: Snapshot validieren
        run: |
          npm run typecheck
          npm test -- --run src/medikamente/swissmedic.test.ts src/medikamente/produkte.test.ts

      - name: Snapshot in Phase-2-Branch zurückschreiben
        run: |
          if git diff --quiet -- daten/medikament-produkte.json; then
            echo "Swissmedic-Snapshot ist unverändert."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten/medikament-produkte.json
          git commit -m "Swissmedic-Produktsnapshot aktualisieren"
          git push origin HEAD:medikamente-phase-2-swissmedic
